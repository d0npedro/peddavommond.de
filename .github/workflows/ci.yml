name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-shell:
    name: Static desktop shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static deploy (vercel-build)
        run: npm run vercel-build

      - name: Assert shell assets
        run: |
          test -f public/index.html
          test -f public/hub/banner.png
          test -f public/hub/spotify.png
          test -f public/hub/suno.png
          test -f public/hub/windows-11.png
          grep -q '/win11/' public/index.html
          grep -q 'tile--windows11' public/index.html
          grep -q 'tile--suno' public/index.html
          test -f public/win11/index.html
          test -f public/win11/js/main.js
          test -f public/win11/js/apps/catalog.js
          test -f public/win11/js/apps/examples-apps.js
          test -f public/win11/js/apps/ExternalApp.js
          grep -q EXAMPLE_APPS public/win11/js/apps/catalog.js
          test -f public/win11/css/main.css
          test -f public/soundcloud.html
          grep -q slotmachine public/win11/js/apps/catalog.js
          grep -q 'Senior AI Consultant' public/portfolio/de/index.html
          grep -q 'Agentic Software Engineer' public/portfolio/de/index.html
          grep -q 'Agentic AI' public/portfolio/de/index.html
          grep -q 'Graph-Mastermind' public/portfolio/de/index.html
          grep -q 'peter.henrichs@web.de' public/portfolio/de/index.html
          test -f public/portfolio/cv/index.html
          test -f public/portfolio/de/cases/graph-mastermind/index.html
          test -f public/portfolio/en/cases/graph-mastermind/index.html
          test -f public/portfolio/de/cases/agent-collective/index.html
          test -f public/portfolio/en/cases/agent-collective/index.html
          test -f public/portfolio/de/cases/deutschlandcard/index.html
          test -f public/portfolio/en/cases/deutschlandcard/index.html
          test -f public/portfolio/de/cases/dz-bank-okvp/index.html
          test -f public/portfolio/de/cases/bitmarck-bitgo/index.html
          grep -q '/portfolio/de/cases/graph-mastermind/' public/portfolio/de/index.html
          grep -q '/portfolio/de/cases/agent-collective/' public/portfolio/de/index.html
          grep -q '/portfolio/de/cases/deutschlandcard/' public/portfolio/de/index.html
          grep -q 'graph-mastermind' public/portfolio/de/sitemap.xml
          grep -q 'deutschlandcard' public/portfolio/de/sitemap.xml
          test ! -d public/portfolio/de/cases/enterprise-integration
          grep -q 'peter.henrichs@web.de' public/portfolio/de/index.html
          ! grep -q 'ph@d0npedro.com' public/portfolio/de/index.html
          ! grep -qi 'Hennrichs' public/portfolio/de/index.html public/portfolio/en/index.html
          grep -q 'kein LLM-Backend' public/portfolio/de/cases/agent-collective/index.html
          grep -q 'peter.henrichs@web.de' public/portfolio/de/cases/graph-mastermind/index.html
          grep -q 'Köln · Deutschlandweit / Remote' public/portfolio/de/index.html
          grep -q 'Independent R&amp;D' public/portfolio/de/index.html
          grep -q 'Peter Henrichs' public/portfolio/de/index.html
          grep -q 'Peter Henrichs' public/portfolio/en/index.html
          grep -q 'peter.henrichs@web.de' public/portfolio/en/index.html
          grep -q 'Die Schicht zwischen System und Agent.' public/portfolio/de/index.html
          grep -q 'The layer between the system and the agent.' public/portfolio/en/index.html
          grep -q 'Arbeit anfassen' public/portfolio/de/index.html
          grep -q 'Touch the work' public/portfolio/en/index.html
          grep -q 'id="builds"' public/portfolio/de/index.html
          grep -q 'id="sample-collective"' public/portfolio/de/index.html
          grep -q 'id="cases"' public/portfolio/de/index.html
          grep -q 'id="sample-graph"' public/portfolio/de/index.html
          grep -q 'id="offer"' public/portfolio/de/index.html
          grep -q 'id="about"' public/portfolio/de/index.html
          grep -q 'data-touch="collective"' public/portfolio/de/index.html
          grep -q 'data-touch="contract"' public/portfolio/en/index.html
          grep -q 'Wie man mich anbietet' public/portfolio/de/index.html
          grep -q 'How to offer me' public/portfolio/en/index.html
          grep -q 'Senior AI Consultant' public/portfolio/en/index.html
          grep -q 'Agentic Engineer' public/portfolio/de/index.html
          grep -q 'Agentic Engineer' public/portfolio/en/index.html
          grep -q 'Transformation Lead' public/portfolio/de/index.html
          grep -q 'Transformation Lead' public/portfolio/en/index.html
          grep -q 'Agent Collective' public/portfolio/de/index.html
          grep -q 'Agent Collective' public/portfolio/en/index.html
          grep -q 'DeutschlandCard' public/portfolio/de/index.html
          grep -q 'DeutschlandCard' public/portfolio/en/index.html
          grep -q '/portfolio/en/cases/graph-mastermind/' public/portfolio/en/index.html
          grep -q '/portfolio/en/cases/agent-collective/' public/portfolio/en/index.html
          grep -q '/portfolio/en/cases/deutschlandcard/' public/portfolio/en/index.html
          grep -q 'kein LLM-Backend' public/portfolio/de/index.html
          grep -q '>Agent-Failure<' public/portfolio/de/index.html
          grep -q '>Agent failure<' public/portfolio/en/index.html
          ! grep -q '\[object Object\]' public/portfolio/de/index.html public/portfolio/en/index.html
          grep -q 'no LLM backend' public/portfolio/en/index.html
          grep -q 'Wie ich AI-Systeme baue' public/portfolio/de/index.html
          grep -q 'How I build AI systems' public/portfolio/en/index.html
          grep -q 'Agentic-AI-Case ansehen' public/portfolio/de/index.html
          grep -q 'Lebenslauf' public/portfolio/de/index.html
          grep -q 'Mein Anteil' public/portfolio/de/cases/graph-mastermind/index.html
          grep -q 'Evaluation läuft' public/portfolio/de/cases/graph-mastermind/index.html
          grep -q 'Independent R&amp;D' public/portfolio/en/index.html
          grep -q 'Now applied to Agentic AI' public/portfolio/en/index.html
          grep -q 'ProfilePage' public/portfolio/de/index.html
          grep -q 'ProfilePage' public/portfolio/en/index.html
          ! grep -q 'id="value"' public/portfolio/de/index.html
          ! grep -q 'AI Cases ansehen' public/portfolio/de/index.html
          ! grep -q 'Ich verbinde über 10 Jahre Enterprise Software Engineering mit Agentic AI' public/portfolio/de/index.html
          ! grep -q 'Wo ich Wirkung erzeuge' public/portfolio/de/index.html
          ! grep -q 'Where I create value' public/portfolio/de/index.html
          ! grep -q '10+ Jahre Enterprise-Systeme' public/portfolio/de/index.html
          ! grep -q '10+ years enterprise systems' public/portfolio/de/index.html
          ! grep -q 'ENTWICKLUNG' public/portfolio/de/index.html

      - name: Formula unit test (optional shell util)
        run: node public/win11/js/utils/formula.test.js

  agent-docs:
    name: Agent docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required agent/docs files
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f README.md
          test -f docs/WINDOWS-DESKTOP.md
          test -f .github/copilot-instructions.md
          test -f vercel.json
          test -f package.json
