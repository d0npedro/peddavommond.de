name: Deploy Vercel production

# Optional: runs when Vercel Git integration is not used.
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Prefer linking the GitHub repo in the Vercel dashboard for automatic deploys.
#
# Do not use `if: secrets.*` on jobs — GitHub rejects that as a workflow file error.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "vercel.json"
      - "package.json"
      - "scripts/prepare-static-deploy.mjs"
      - "*.html"
      - ".github/workflows/deploy-vercel.yml"

jobs:
  guard:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not set; skipping production deploy."
          fi

  deploy:
    name: vercel --prod
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Static prepare
        run: npm run vercel-build

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
