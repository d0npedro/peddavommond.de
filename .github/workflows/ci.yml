name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-shell:
    name: Static desktop shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static deploy (vercel-build)
        run: npm run vercel-build

      - name: Assert shell assets
        run: |
          test -f public/index.html
          test -f public/hub/banner.png
          test -f public/hub/spotify.png
          test -f public/hub/suno.png
          test -f public/hub/windows-11.png
          grep -q '/win11/' public/index.html
          grep -q 'tile--windows11' public/index.html
          grep -q 'tile--suno' public/index.html
          test -f public/win11/index.html
          test -f public/win11/js/main.js
          test -f public/win11/js/apps/catalog.js
          test -f public/win11/js/apps/examples-apps.js
          test -f public/win11/js/apps/ExternalApp.js
          grep -q EXAMPLE_APPS public/win11/js/apps/catalog.js
          test -f public/win11/css/main.css
          test -f public/soundcloud.html
          grep -q slotmachine public/win11/js/apps/catalog.js

      - name: Formula unit test (optional shell util)
        run: node public/win11/js/utils/formula.test.js

  agent-docs:
    name: Agent docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required agent/docs files
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f README.md
          test -f docs/WINDOWS-DESKTOP.md
          test -f .github/copilot-instructions.md
          test -f vercel.json
          test -f package.json
